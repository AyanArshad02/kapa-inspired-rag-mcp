global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'query-service'
    static_configs:
      - targets: ['query-service:8000']
    metrics_path: /metrics

  - job_name: 'ingestion-service'
    static_configs:
      - targets: ['ingestion-service:8001']
    metrics_path: /metrics
