# Production compose — images pulled from ECR, no build context.
# All secrets injected via .env file on the EC2 host.
#
# Required env vars (set in /home/ec2-user/kapa-rag-mcp/.env):
#   ECR_REGISTRY     — AWS account ID.dkr.ecr.<region>.amazonaws.com
#   IMAGE_TAG        — git short SHA, set by the deploy workflow
#   POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
#   OPENAI_API_KEY / COHERE_API_KEY
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / S3_REGION / S3_BUCKET
#   LANGSMITH_API_KEY (optional)

services:

  # ── Storage Layer ────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: kapa_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kapa_rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    # No port binding — only reachable on the internal Docker network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-kapa_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kapa_net

  redis:
    image: redis/redis-stack-server:latest
    container_name: kapa_redis
    volumes:
      - redis_data:/data
    command: redis-stack-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    # No port binding — only reachable on the internal Docker network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kapa_net

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: kapa_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    # No port binding — only reachable on the internal Docker network.
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kapa_net

  # ── Application Layer ────────────────────────────────────────────────────────

  ingestion-service:
    image: ${ECR_REGISTRY}/kapa-ingestion:${IMAGE_TAG:-latest}
    container_name: kapa_ingestion
    ports:
      - "9001:8001"
    environment:
      - EXTRA_ALLOWED_ORIGINS=${EXTRA_ALLOWED_ORIGINS:-}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kapa_rag}
      - S3_BUCKET=${S3_BUCKET:-kapa-rag-uploads}
      - S3_REGION=${S3_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - SERVICE_PORT=8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    networks:
      - kapa_net

  webhook-service:
    image: ${ECR_REGISTRY}/kapa-webhook:${IMAGE_TAG:-latest}
    container_name: kapa_webhook
    ports:
      - "8003:8003"
    command: ["uvicorn", "backend.api.webhook:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kapa_rag}
      - SERVICE_PORT=8003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kapa_net

  celery-worker:
    image: ${ECR_REGISTRY}/kapa-celery:${IMAGE_TAG:-latest}
    container_name: kapa_celery
    command: celery -A backend.strategies.queue.celery_redis_queue worker --loglevel=info --concurrency=1
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kapa_rag}
      - S3_BUCKET=${S3_BUCKET:-kapa-rag-uploads}
      - S3_REGION=${S3_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    depends_on:
      - redis
      - postgres
      - qdrant
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    restart: unless-stopped
    networks:
      - kapa_net

  celery-beat:
    image: ${ECR_REGISTRY}/kapa-celery:${IMAGE_TAG:-latest}
    container_name: kapa_celery_beat
    command: celery -A backend.strategies.queue.celery_redis_queue beat --loglevel=info
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kapa_rag}
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - kapa_net

  query-service:
    image: ${ECR_REGISTRY}/kapa-query:${IMAGE_TAG:-latest}
    container_name: kapa_query
    ports:
      - "9000:8000"
    environment:
      - EXTRA_ALLOWED_ORIGINS=${EXTRA_ALLOWED_ORIGINS:-}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kapa_rag}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - SERVICE_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kapa_net

  auth-service:
    image: ${ECR_REGISTRY}/kapa-auth:${IMAGE_TAG:-latest}
    container_name: kapa_auth
    ports:
      - "8004:8004"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kapa_rag}
      - JWT_SECRET=${JWT_SECRET}
      - SERVICE_PORT=8004
      - EXTRA_ALLOWED_ORIGINS=${EXTRA_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kapa_net

  streamlit:
    image: ${ECR_REGISTRY}/kapa-streamlit:${IMAGE_TAG:-latest}
    container_name: kapa_streamlit
    ports:
      - "8501:8501"
    environment:
      - INGESTION_URL=http://ingestion-service:8001
      - QUERY_URL=http://query-service:8000
    depends_on:
      query-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kapa_net

  frontend:
    image: ${ECR_REGISTRY}/kapa-frontend:${IMAGE_TAG:-latest}
    container_name: kapa_frontend
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:
      - kapa_net

  # mcp-server omitted from prod — stdio transport only, designed for local
  # Claude Desktop / Claude Code use, not a public HTTP endpoint.

  # ── Observability Layer ──────────────────────────────────────────────────────
  # Prometheus + Grafana omitted on t3.small (2GB RAM) to stay within memory budget.
  # Services still expose /metrics endpoints — add these back when on t3.medium+.

networks:
  kapa_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
