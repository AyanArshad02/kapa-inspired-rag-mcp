[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kapa-inspired-rag-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # API framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # LLM + embeddings
    "openai>=1.30.0",
    "cohere>=5.5.0",
    "tiktoken>=0.7.0",

    # Vector DB
    "qdrant-client>=1.9.0",

    # Queue
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",

    # Database
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",

    # Document processing
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",

    # MCP server
    "mcp>=1.0.0",

    # Observability
    "langsmith>=0.1.77",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ragas>=0.1.14",
    "datasets>=2.19.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
