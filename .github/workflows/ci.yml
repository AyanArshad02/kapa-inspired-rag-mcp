name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    env:
      # Fake key so pydantic-settings can instantiate Settings(); unit tests mock all API calls
      OPENAI_API_KEY: "test-key-unit-tests"
      COHERE_API_KEY: "test-key"
      GITHUB_TOKEN: "test-key"
      QDRANT_URL: "http://localhost:6333"
      REDIS_URL: "redis://localhost:6379"
      POSTGRES_URL: "postgresql+asyncpg://kapa:kapa@localhost:5432/kapa_rag"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]" --quiet

      - name: Lint (ruff)
        run: ruff check backend/ eval/ tests/

      - name: Unit tests
        run: |
          pytest tests/unit/ \
            -v --tb=short \
            --cov=backend --cov-report=term-missing \
            --cov-fail-under=70

  ragas-gate:
    name: RAGAS Quality Gate
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Only run when OpenAI key is available (skip on forks to avoid leaking secrets)
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]" --quiet

      - name: Run RAGAS gate
        run: python eval/ragas_gate.py --sample 20
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
